name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an older run when new commits are pushed to the same PR/branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version pinned in package.json's packageManager field
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Includes the type-check (tsc -b)
      - run: pnpm run build
      - run: pnpm test
